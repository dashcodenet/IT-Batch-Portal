[build]
  publish = "frontend"
  functions = "netlify/functions"
  command = "# لا يوجد أمر بناء، نرفع الملفات مباشرة"

# إعادة توجيه أي رابط غير موجود إلى صفحة 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# الأمان والكاش
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"