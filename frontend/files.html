<!DOCTYPE html>
<html lang="en" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملفات | IT Batch Portal</title>
    <!-- ⭐️ استدعاء خط Cairo من جوجل -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html { background-color: #0F172A !important; color-scheme: dark !important; }
        body { background-color: #0F172A !important; margin: 0; }
    </style>
    <script src="js/lucide.min.js" defer></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body class="lang-en">

    <main class="container" style="padding-top: var(--space-6); min-height: 80vh;">
        
        <!-- Breadcrumb -->
        <div style="margin-bottom: var(--space-4); color: var(--color-text-muted); font-size: 0.9rem;">
            <a href="index.html" style="color:var(--color-primary);" data-i18n="nav.home">الرئيسية</a> 
            <span style="margin:0 8px;">/</span> 
            <a href="materials.html" style="color:var(--color-primary);" data-i18n="nav.materials">المواد</a>
            <span style="margin:0 8px;">/</span> 
            <span id="subject-title">المادة</span>
        </div>

        <!-- 1. Types Grid (النظري / العملي) -->
        <div id="types-grid" class="grid-3" style="margin-bottom: var(--space-6);">
            <!-- Rendered by JS -->
        </div>

        <!-- 2. Categories Grid (الفئات) -->
        <div id="categories-grid" class="grid-3" style="margin-bottom: var(--space-6);">
            <!-- Rendered by JS -->
        </div>

        <!-- ⭐️ كتلة البحث والزر العائمين (تظهر فقط عند فتح فئة) -->
        <div id="sticky-controls" style="display: none;">
            <div class="section-title" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-3);">
                <h2 id="current-category-title" style="font-size: 1.25rem;"></h2>
                <button id="back-to-categories" class="btn btn-secondary" style="padding: 8px 16px;">
                    <i data-lucide="arrow-right"></i> عودة للفئات
                </button>
            </div>
            <div class="search-wrapper" style="margin-bottom: 0;">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="file-search" class="search-input" data-i18n-placeholder="files.search_placeholder" placeholder="ابحث في أسماء الملفات...">
            </div>
        </div>

        <!-- 3. Files List Container -->
        <div id="files-list-container" style="display:none;">
            <div id="files-list" class="file-list">
                <!-- Rendered by JS -->
            </div>
        </div>
        
    </main>

    <!-- Scripts -->
    <script src="js/config.js?v=112" defer></script>
    <script src="js/cache.js?v=112" defer></script>
    <script src="js/error-handler.js?v=112" defer></script>
    <script src="js/toast.js?v=112" defer></script>
    <script src="js/api.js?v=112" defer></script>
    <script src="js/i18n.js?v=112" defer></script>
    <script src="js/lang-switcher.js?v=112" defer></script>
    
    <script src="js/layout.js?v=112" defer></script>
    <script src="js/ui.js?v=112" defer></script>
    
    <script src="js/favorites.js?v=112" defer></script>
    <script src="js/preview.js?v=112" defer></script>
    <script src="js/search.js?v=112" defer></script>
    <script src="js/files.js?v=112" defer></script>
    <script src="js/pwa.js?v=112" defer></script>
</body>
</html>
