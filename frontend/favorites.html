<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav.favorites">Favorites | IT Batch Portal</title>
    
    <style>
        html { background-color: #0F172A !important; color-scheme: dark !important; }
        body { background-color: #0F172A !important; margin: 0; }
    </style>
    <script>
        (function() {
            document.documentElement.classList.add('dark');
            const savedLang = localStorage.getItem('itp_lang') || 'en';
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E40AF">
    <link rel="stylesheet" href="css/fonts.css">
    <script src="js/lucide.min.js" defer></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body class="lang-en">

    <main class="container" style="padding-top: var(--space-6); min-height: 80vh;">
        <h1 class="section-title">
            <i data-lucide="heart" style="color: var(--color-danger);"></i> 
            <span data-i18n="nav.favorites">Favorites</span>
        </h1>

        <!-- حالة فارغة -->
        <div id="favorites-empty" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: var(--color-text-muted);">
            <i data-lucide="heart-off" style="width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5;"></i>
            <h2 data-i18n="favorites.empty_title" style="font-size: 1.5rem; margin-bottom: 8px; color: var(--color-text);">Your favorites are empty</h2>
            <p data-i18n="favorites.empty_desc" style="margin-bottom: 24px;">You haven't added any files to favorites yet.</p>
            <a href="materials.html" class="btn btn-primary">
                <i data-lucide="folder-search"></i> 
                <span data-i18n="favorites.browse">Browse Materials</span>
            </a>
        </div>

        <!-- قائمة المفضلة -->
        <div id="favorites-list-container" style="display: none;">
            <div id="favorites-list" class="file-list"></div>
        </div>
    </main>

    <script src="js/config.js?v=118" defer></script>
    <script src="js/error-handler.js?v=118" defer></script>
    <script src="js/toast.js?v=118" defer></script>
    <script src="js/i18n.js?v=118" defer></script>
    <script src="js/lang-switcher.js?v=118" defer></script>
    <script src="js/layout.js?v=118" defer></script>
    <script src="js/favorites.js?v=118" defer></script>
    <script src="js/preview.js?v=118" defer></script>
    <script src="js/favorites-page.js?v=118" defer></script>
</body>
</html>
