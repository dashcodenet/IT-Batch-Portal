<!DOCTYPE html>
<html lang="en" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | IT Batch Portal</title>

    <!-- ⭐️ السكربت السريع لمنع الوميض الأبيض (يجب أن يكون أول شيء في الـ head) -->
    <style>
        html {
            background-color: #0F172A !important;
            color-scheme: dark !important;
        }
        body {
            background-color: #0F172A !important;
            margin: 0;
        }
    </style>
    <script>
        (function() {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            
            const savedLang = localStorage.getItem('itp_lang') || 'en';
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- ⭐️ استدعاء خط Cairo من جوجل -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/lucide.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="lang-ar" style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;">
    <div class="container">
        <div style="color:var(--color-primary);margin-bottom:20px;">
            <i data-lucide="compass" style="width:80px;height:80px;"></i>
        </div>
        <h1 style="font-size:3rem;font-weight:700;margin-bottom:10px;">404</h1>
        <h2 style="font-size:1.5rem;margin-bottom:20px;">عذراً، الصفحة غير موجودة</h2>
        <p style="color:var(--color-text-muted);margin-bottom:30px;">يبدو أنك وصلت إلى رابط غير صحيح أو أن الصفحة تم نقلها.</p>
        <a href="index.html" class="btn btn-primary">
            <i data-lucide="home"></i> العودة للرئيسية
        </a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
